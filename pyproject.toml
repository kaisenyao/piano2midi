[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "piano2midi"
version = "0.1.0"
description = "Turn solo piano recordings into performance MIDI (notes, velocity, sustain pedal) with Transkun."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "transkun==2.0.1",
    "torch",
    "pretty_midi",
    "numpy",
    "imageio-ffmpeg",
    "yt-dlp[default]",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn", "python-multipart"]
dev = ["pytest", "httpx", "mir_eval"]

[project.scripts]
piano2midi = "piano2midi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
