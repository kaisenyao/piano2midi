[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "piano2midi"
version = "0.1.0"
description = "Turn solo piano recordings into performance MIDI (notes, velocity, sustain pedal) with Transkun."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "transkun==2.0.1",
    "torch",
    "pretty_midi",
    "numpy",
    "imageio-ffmpeg",
    "yt-dlp[default]",
    "openai",
    "anthropic",
    "mido",
    "python-rtmidi",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn", "python-multipart"]
voice = ["sounddevice", "openwakeword"]

[project.scripts]
piano2midi = "piano2midi.cli:main"
piano2midi-chat = "piano2midi.chat:main"
piano2midi-library = "piano2midi.library:main"
piano2midi-play = "piano2midi.play:main"
piano2midi-voice = "piano2midi.voice:main"

[tool.setuptools.packages.find]
where = ["src"]
